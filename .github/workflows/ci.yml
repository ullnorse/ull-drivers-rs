name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Workspace Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check --all

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --locked --all-targets --all-features

      - name: Run doctests
        run: cargo test --locked --workspace --doc --all-features

      - name: Verify packages
        run: cargo package --workspace --locked

  embedded:
    name: Embedded Target Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned toolchain with target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          targets: riscv32imac-unknown-none-elf

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check embedded target build
        run: cargo check --locked --workspace --all-features --target riscv32imac-unknown-none-elf

  features:
    name: Feature Matrix
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check ull-sht3x feature matrix
        run: cargo hack check -p ull-sht3x --feature-powerset --locked --no-dev-deps

      - name: Check ull-ssd1306 feature matrix
        run: cargo hack check -p ull-ssd1306 --feature-powerset --locked --no-dev-deps
