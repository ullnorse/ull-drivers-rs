[package]
name = "ull-ssd1681"
version = "0.1.0"
edition.workspace = true
description = "no_std embedded-hal 1.0 SSD1681 e-paper driver for the Good Display GDEY0154D67 (200x200 black/white)"
license.workspace = true
repository.workspace = true
readme = "README.md"
rust-version = "1.85"

[lints]
workspace = true

[dependencies]
defmt = { version = "1.0", optional = true }
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }

[features]
default = []
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt"]
